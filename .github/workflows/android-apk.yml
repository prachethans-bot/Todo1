name: Build & Share Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".env.example"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses and ensure API 36 SDK
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;35.0.1"

      - name: Prepare signing keystore and optional secrets
        run: |
          rm -rf .gradle/9.3.1 .gradle/buildOutputCleanup
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f ".env" ]; then
            cp .env.example .env
            if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
              sed -i "s|^VITE_SUPABASE_URL=.*|VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}|" .env
            fi
            if [ -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
              sed -i "s|^VITE_SUPABASE_ANON_KEY=.*|VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}|" .env
            fi
            if [ -n "${{ secrets.VITE_PUBLIC_URL }}" ]; then
              sed -i "s|^VITE_PUBLIC_URL=.*|VITE_PUBLIC_URL=${{ secrets.VITE_PUBLIC_URL }}|" .env
            fi
          fi

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK package, alignment, and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/aapt"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='com.aistudio.vinai.kqmxzp'|sdkVersion:"
          cp "$APK" vinai-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vinai-android-apk
          path: vinai-app.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish shareable APK to latest GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skipping release publication because this APK build is stale."
            exit 0
          fi
          test -s vinai-app.apk
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest vinai-app.apk \
              --title "வினை (Vinai) — Android APK" \
              --notes "Download vinai-app.apk on any Android device to install."
          else
            gh release upload latest vinai-app.apk --clobber
            gh release edit latest \
              --title "வினை (Vinai) — Android APK" \
              --notes "Download vinai-app.apk on any Android device to install." \
              --latest
          fi
